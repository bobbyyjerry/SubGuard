<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171419">
  <meta name="description" content="SubGuard helps you track subscriptions and free trials and reminds you before you're charged.">
  <title>{% block title %}Track subscriptions &amp; free trials{% endblock %} · SubGuard</title>

  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable position-absolute m-2 btn btn-light" href="#main">Skip to content</a>

  {% include "partials/_navbar.html" %}

  <main id="main" class="flex-grow-1">
    {% include "partials/_flash.html" %}
    {% block content %}{% endblock %}
  </main>

  {% include "partials/_footer.html" %}
  {% include "partials/_confirm_modal.html" %}
  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
